<!doctype html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1318">
  <!-- Datenschutz-Garantie: Der Browser darf KEINE Verbindungen zu fremden Servern aufbauen.
       (Nur wenn du die optionale KI-Anbindung nutzen willst, musst du connect-src erweitern, siehe README.) -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Lernapp</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header id="top">
    <h1 id="title">Lernapp</h1>
    <a id="btn-settings" href="#/settings" aria-label="Einstellungen">⚙</a>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav id="tabs" aria-label="Hauptnavigation">
    <a href="#/learn"   data-route="learn"><span class="ic">🗂</span>Lernen</a>
    <a href="#/audio"   data-route="audio"><span class="ic">🎧</span>Hören</a>
    <a href="#/exam"    data-route="exam"><span class="ic">🎓</span>Prüfung</a>
    <a href="#/stats"   data-route="stats"><span class="ic">📊</span>Statistik</a>
    <a href="#/content" data-route="content"><span class="ic">📚</span>Inhalte</a>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
